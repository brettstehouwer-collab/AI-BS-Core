apply plugin: 'com.android.application'

android {
    namespace 'com.stehouwerpublishing.feexpressdriver'
    compileSdk 36

    defaultConfig {
        applicationId 'com.stehouwerpublishing.feexpressdriver'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Zero heavyweight external binary dependencies - pure lean Android runtime
}
