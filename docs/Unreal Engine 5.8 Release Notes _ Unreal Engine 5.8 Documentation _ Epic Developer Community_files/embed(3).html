    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const AUTOPLAY = 'autoplay';
        const LOOP='loop'
        const MUTED='MUTED'
        const videoUrl = "qsep://cdn.qstv.on.epicgames.com/99575efd-dacf-4931-b8c3-27ff11bddef8?s=eyJraWQiOiJMRW13ZEZzVmMiLCJhbGciOiJIUzUxMiJ9.eyJzdWIiOiJtOXk5V0J1b1dqSzJvWEVYbXBmOG9iQUVjTGcxOXRlM0VmZHFIVzFkM2drPSIsImV4cCI6MTc4NjQ3MjE3OH0.wBiI6DBAOkm1Ws3vf3D_bWkg_oCBKAHJfasvS2EmnnRbRGtrgHs8wg-93h3cv5xXoIIX4JxYRGxu_CpYqr51Uw";
        const posterUrl = `${document.location.origin}/community/api/cms/image/ae09b9ac-5ab1-4e7b-95d7-d4d458c2bb69?assignment_entity_type=video_thumbnail&resizing_type=fill&width=1047&height=573`;
        const urlSearchParams = new URLSearchParams(window.location.search)
        const electraPlayer = document.getElementById('electraPlayer')

        const sources = [ 
          {
            src:  videoUrl,
            type: "quicksilver"
          },
        ]

        if (urlSearchParams.get(AUTOPLAY)){
        electraPlayer.setAttribute(MUTED,'')
        electraPlayer.setAttribute(AUTOPLAY,'')

         }
        if (urlSearchParams.get(LOOP)) electraPlayer.setAttribute(LOOP,'')


        let isPlayerLoaded = false
        let isPlayerVisible = false

        const playerObserver = new IntersectionObserver(event => {
          isPlayerVisible = event[0].isIntersecting
          if (isPlayerVisible && !isPlayerLoaded) {
            isPlayerLoaded = true

            const player = new electra.ElectraPlayer({
              appId: 'EDC',
              videoElement: 'electraPlayer',
              environment: 'production',
              sources: sources,
              poster: posterUrl,
            })
          }
        }, { threshold: .05 })

        playerObserver.observe(electraPlayer)
      })
    </script>
