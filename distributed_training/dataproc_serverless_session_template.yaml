name: projects/ai-bs-dashboard/locations/us-central1/sessionTemplates/spark-distributed-training-template
description: "AI-BS High-Performance Serverless Spark Session Template for Distributed ML Training"
labels:
  workload: distributed-training
  framework: pyspark-pytorch
  managed-by: ai-bs-system
  tier: enterprise-gpu-cpu
environmentConfig:
  executionConfig:
    serviceAccount: dataproc-serverless-sa@ai-bs-dashboard.iam.gserviceaccount.com
    networkTags:
      - dataproc-serverless
      - distributed-training
    stagingBucket: gs://ai-bs-dataproc-staging-us-central1
    ttl: 28800s
runtimeConfig:
  version: "2.2"
  properties:
    spark.dynamicAllocation.enabled: "true"
    spark.dynamicAllocation.minExecutors: "2"
    spark.dynamicAllocation.maxExecutors: "32"
    spark.dynamicAllocation.initialExecutors: "4"
    spark.executor.cores: "4"
    spark.executor.memory: "16g"
    spark.executor.memoryOverhead: "2g"
    spark.driver.cores: "4"
    spark.driver.memory: "16g"
    spark.driver.memoryOverhead: "2g"
    spark.sql.shuffle.partitions: "200"
    spark.sql.adaptive.enabled: "true"
    spark.sql.adaptive.coalescePartitions.enabled: "true"
    spark.sql.execution.arrow.pyspark.enabled: "true"
    spark.dataproc.driverEnv.PIP_PACKAGES: "torch torchvision torchaudio scikit-learn pandas numpy pyarrow google-cloud-storage google-cloud-bigquery"
jupyterSession:
  kernel: PYTHON
  displayName: "PySpark Distributed Training Kernel (Python 3.11 / Spark 3.5)"

