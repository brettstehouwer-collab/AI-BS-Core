[pytest]
testpaths = tier1_features tier2_boundary tier3_pairwise tier4_scenarios tier5_adversarial
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    tier1: Tier 1 feature coverage tests (18 features x >=5 tests)
    tier2: Tier 2 boundary and corner case tests (18 features x >=5 tests)
    tier3: Tier 3 pairwise integration tests (>=18 pairwise tests)
    tier4: Tier 4 real-world application workflow scenarios (>=9 scenarios)
    tier5: Tier 5 adversarial, chaos, and hardening tests (>=10 tests)
    feature(num): Platform feature number (1-18)
    feature_1: Feature 1 - Sheltered Hub Stations (3)
    feature_2: Feature 2 - Spatial Trigger Zones (7)
    feature_3: Feature 3 - Adam Blend Tree Animations
    feature_4: Feature 4 - Native DX12 Viewport Session
    feature_5: Feature 5 - Legacy DirectX 8/9/10 Fallbacks
    feature_6: Feature 6 - Engine Graphics Configuration
    feature_7: Feature 7 - Local ML Training Pipeline
    feature_8: Feature 8 - Distributed Training Driver
    feature_9: Feature 9 - Dataproc Serverless Template
    feature_10: Feature 10 - Dataproc Batch Deployment Script
    feature_11: Feature 11 - Synced Drive Assets 177 Files
    feature_12: Feature 12 - ChromaDB Vector Ingestion
    feature_13: Feature 13 - Microservice Vector Retrieval
    feature_14: Feature 14 - Chapter Creator & Native Studio Audit
    feature_15: Feature 15 - FastAPI Master Engine Audit
    feature_16: Feature 16 - ComfyUI RTX 4090 Bridge Audit
    feature_17: Feature 17 - Vite Frontend Build & Dev Audit
    feature_18: Feature 18 - Opaque-Box E2E Test Suite
addopts = -ra --strict-markers
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
